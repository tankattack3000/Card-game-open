<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kortlek (flera lekar)</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Små tillägg för discard-ytor */
    .side-area { display:flex; flex-direction:column; gap:12px; }
    .deck, .discard { width:120px; height:160px; display:flex; align-items:center; justify-content:center; border-radius:8px; background:white; border:2px solid #ddd; cursor:pointer; user-select:none;}
    .discard { background:#f7f7f7; border-style:dashed; }
    .row { display:flex; gap:20px; align-items:flex-start; margin-bottom:16px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🃏 Kortlek — Testa två lekar</h1>

    <div class="row">
      <div class="side-area">
        <div class="deck" id="deck1">Deck 1 (klicka)</div>
        <div class="discard" id="discard1">Discard 1</div>
      </div>

      <div class="play-area" id="playArea"></div>

      <div class="side-area">
        <div class="deck" id="deck2">Deck 2 (klicka)</div>
        <div class="discard" id="discard2">Discard 2</div>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
