<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Game - Two Decks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🃏 Två Kortlekar</h1>
        
        <div class="game-area">
            <div class="deck-container">
                <h2>Lek 1</h2>
                <div class="deck" id="deck1">
                    <div class="card-placeholder">Klicka för kort</div>
                </div>
            </div>
            
            <div class="play-area" id="playArea"></div>
            
            <div class="deck-container">
                <h2>Lek 2</h2>
                <div class="deck" id="deck2">
                    <div class="card-placeholder">Klicka för kort</div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
